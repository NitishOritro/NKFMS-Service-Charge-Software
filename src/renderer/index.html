<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>সার্ভিস চার্জ ব্যবস্থাপনা</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <form class="login-card" id="loginForm" autocomplete="off">
      <img class="login-logo" src="assets/logo.png" alt="নীলকণ্ঠ ফ্ল্যাট মালিক সমিতি">
      <h1 class="login-title">নীলকণ্ঠ ফ্ল্যাট মালিক সমিতি</h1>
      <p class="login-sub">সার্ভিস চার্জ ব্যবস্থাপনা সফটওয়্যার</p>

      <label class="login-field">
        <span>ইউজার আইডি</span>
        <input type="text" id="loginUser" autocomplete="username" spellcheck="false" autofocus>
      </label>

      <label class="login-field">
        <span>পাসওয়ার্ড</span>
        <input type="password" id="loginPass" autocomplete="current-password">
      </label>

      <p class="login-error" id="loginError" hidden></p>

      <button type="submit" class="btn primary login-submit" id="loginSubmit">প্রবেশ করুন</button>
    </form>
  </div>

  <div class="app" id="appShell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="assets/logo.png" alt="নীলকণ্ঠ ফ্ল্যাট মালিক সমিতি">
        <div class="brand-text">
          <div class="brand-title" id="brandTitle">নীলকণ্ঠ ফ্ল্যাট মালিক সমিতি</div>
          <div class="brand-sub">সার্ভিস চার্জ ব্যবস্থাপনা</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-tab="dashboard"><span class="ico">▤</span> ড্যাশবোর্ড</button>
        <button class="nav-item" data-tab="monthly"><span class="ico">🗓</span> মাসিক হিসাব</button>
        <button class="nav-item" data-tab="collection"><span class="ico">✎</span> মাসিক আদায় এন্ট্রি</button>
        <button class="nav-item" data-tab="flatEntry"><span class="ico">📑</span> একক ফ্ল্যাট এন্ট্রি</button>
        <button class="nav-item" data-tab="dues"><span class="ico">⚠</span> বকেয়া তালিকা</button>
        <button class="nav-item" data-tab="flats"><span class="ico">⌂</span> ফ্ল্যাট ও মালিক</button>
        <button class="nav-item" data-tab="report"><span class="ico">🖨</span> রিপোর্ট</button>
        <button class="nav-item" data-tab="settings"><span class="ico">⚙</span> সেটিংস</button>
      </nav>
      <div class="sidebar-foot">
        <div class="rate-chip">মাসিক হার: <b id="rateChip">—</b></div>
        <div class="signed-in">
          <span id="signedInAs">—</span>
          <button class="link-btn" id="logoutBtn">লগ আউট</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="pageTitle">ড্যাশবোর্ড</h1>
          <p id="pageSub" class="page-sub"></p>
        </div>
        <div class="topbar-right">
          <div class="month-picker" id="monthPicker">
            <span>কার্যরত মাস</span>
            <select id="monthName" aria-label="মাসের নাম"></select>
            <select id="monthYear" aria-label="সাল"></select>
          </div>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <script src="assets/logo_data.js"></script>
  <script src="util.js"></script>
  <script src="calc.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
