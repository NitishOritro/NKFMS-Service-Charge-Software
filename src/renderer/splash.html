<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';">
  <title>NKFMS</title>
  <style>
    :root {
      --ink: #17202e;
      --ink-soft: #5b6879;
      --line: #e4e9f1;
      --brand: #1d5c53;
      --navy: #14294b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: default;
      font-family: 'Nirmala UI', 'Shonar Bangla', 'Vrinda', 'Segoe UI', system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .splash {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(15, 30, 55, .28);
      animation: rise .32s ease-out both;
    }

    /* উপরের ব্র্যান্ড রেখা */
    .splash::before {
      content: '';
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, var(--navy), #1d5c53 55%, #2b7d70);
    }

    /* লোগোর পেছনের নরম আভা */
    .glow {
      position: absolute;
      top: -110px; left: 50%;
      width: 460px; height: 340px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(29, 92, 83, .10), rgba(29, 92, 83, 0) 68%);
      pointer-events: none;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px 40px 20px;
      text-align: center;
    }

    .logo {
      width: 122px;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(15, 30, 55, .16));
      animation: pop .55s cubic-bezier(.2, .8, .3, 1) both;
    }

    .title {
      margin: 16px 0 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .2px;
      animation: rise .5s ease-out .1s both;
    }

    .sub {
      margin: 5px 0 0;
      font-size: 13px;
      color: var(--ink-soft);
      animation: rise .5s ease-out .18s both;
    }

    .rule {
      width: 46px;
      height: 2px;
      margin: 16px 0 0;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--navy), #2b7d70);
      opacity: .55;
      animation: rise .5s ease-out .24s both;
    }

    /* অনির্দিষ্ট অগ্রগতি বার */
    .progress {
      position: relative;
      width: 208px;
      height: 3px;
      margin-top: 20px;
      border-radius: 3px;
      background: #e9eef5;
      overflow: hidden;
      animation: rise .5s ease-out .3s both;
    }

    .progress span {
      position: absolute;
      top: 0; bottom: 0;
      width: 42%;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(29, 92, 83, .15), var(--brand), rgba(29, 92, 83, .15));
      animation: sweep 1.15s ease-in-out infinite;
    }

    .status {
      margin: 11px 0 0;
      font-size: 11.5px;
      color: var(--ink-soft);
      letter-spacing: .2px;
      animation: rise .5s ease-out .34s both;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 18px;
      border-top: 1px solid var(--line);
      background: #f7f9fc;
      font-size: 11px;
      color: var(--ink-soft);
    }

    .foot b { color: var(--ink); font-weight: 600; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(10px) scale(.9); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes sweep {
      0%   { left: -45%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash, .logo, .title, .sub, .rule, .progress, .status { animation: none; }
      .progress span { animation-duration: 2.2s; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="glow"></div>

    <div class="body">
      <img class="logo" src="assets/logo.png" alt="নীলকণ্ঠ ফ্ল্যাট মালিক সমিতি">
      <h1 class="title">নীলকণ্ঠ ফ্ল্যাট মালিক সমিতি</h1>
      <p class="sub">সার্ভিস চার্জ ব্যবস্থাপনা সফটওয়্যার</p>
      <div class="rule"></div>
      <div class="progress"><span></span></div>
      <p class="status">প্রস্তুত করা হচ্ছে…</p>
    </div>

    <div class="foot">
      <span>সংস্করণ <b>১.০.০</b></span>
      <span>ICB Software Dev Team</span>
    </div>
  </div>
</body>
</html>
