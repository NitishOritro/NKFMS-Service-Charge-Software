# GitHub-এ পুশ করলেই Firebase Hosting-এ অ্যাপটি নিজে থেকে ডিপ্লয় হয়।
#
# শর্ত: রিপোজিটরির Settings → Secrets and variables → Actions-এ
#       FIREBASE_SERVICE_ACCOUNT নামে সার্ভিস অ্যাকাউন্টের JSON বসানো
#       থাকতে হবে। সবচেয়ে সহজে সেটি বসে `firebase init hosting:github`
#       কমান্ডে।
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Actions ট্যাব থেকে হাতে চালানোর বোতাম

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: নির্ভরতা ইনস্টল
        run: npm ci

      - name: বিল্ড
        run: npm run build

      - name: Firebase-এ ডিপ্লয়
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: nkfms-8c1a6
          channelId: live
